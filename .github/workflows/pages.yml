name: Build PDF and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PDF_NAME: Illia_Skapchuk_Head_of_QA_2026.pdf

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Render A4 PDF from index.html
        run: |
          mkdir -p _site
          cp index.html _site/
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --virtual-time-budget=10000 \
            --print-to-pdf="$PWD/_site/$PDF_NAME" "file://$PWD/index.html"
          test -s "_site/$PDF_NAME"
          ls -la _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
